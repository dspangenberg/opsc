# Docker-Compose-Deployment für opsc (Laravel 13, PHP 8.5)
#
# Eine Ressource vom Typ "Docker Compose" in Coolify:
#   app (nginx+PHP-FPM, Port 8080), reverb (WebSocket), worker (Queue),
#   migrate (Einmal-Job), mysql, redis.
# Alle Laravel-Prozesse laufen auf demselben Image (gleiche PHP-8.5-Runtime).
#
# Pflicht-Variablen (Coolify → Compose-Ressource → Environment):
#   APP_KEY, APP_URL, DB_PASSWORD, DB_ROOT_PASSWORD,
#   REVERB_APP_ID, REVERB_APP_KEY, REVERB_APP_SECRET, REVERB_HOST
# Optionale Build-Variablen (VITE_*), siehe x-app-build.

x-app-build: &app-build
  context: .
  dockerfile: Dockerfile
  args:
    VITE_APP_NAME: ${VITE_APP_NAME:-opsc}
    VITE_APP_URL: ${VITE_APP_URL:-}
    VITE_APP_DATE_FORMAT: ${VITE_APP_DATE_FORMAT:-}
    VITE_APP_TIME_FORMAT: ${VITE_APP_TIME_FORMAT:-}
    VITE_APP_DATE_TIME_FORMAT: ${VITE_APP_DATE_TIME_FORMAT:-}
    VITE_SENTRY_ENABLED: ${VITE_SENTRY_ENABLED:-}
    VITE_SENTRY_DNS: ${VITE_SENTRY_DNS:-}
    VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY:-}
    VITE_REVERB_HOST: ${VITE_REVERB_HOST:-}
    VITE_REVERB_PORT: ${VITE_REVERB_PORT:-443}
    VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-https}

x-app-env: &app-env
  APP_NAME: ${APP_NAME:-opsc}
  APP_ENV: production
  APP_KEY: ${APP_KEY:?APP_KEY ist in Coolify zu setzen}
  APP_DEBUG: "false"
  APP_URL: ${APP_URL:?APP_URL ist in Coolify zu setzen}
  APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Berlin}
  APP_LOCALE: ${APP_LOCALE:-de}
  APP_MAINTENANCE_DRIVER: file

  LOG_CHANNEL: stack
  LOG_STACK: single
  LOG_LEVEL: ${LOG_LEVEL:-warning}
  LOG_VIEWER_ENABLED: "false"

  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_DATABASE: ${DB_DATABASE:-opsc}
  DB_USERNAME: ${DB_USERNAME:-opsc}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD ist in Coolify zu setzen}

  SESSION_DRIVER: redis
  SESSION_LIFETIME: "120"
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  BROADCAST_CONNECTION: reverb
  FILESYSTEM_DISK: local

  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: null

  REVERB_APP_ID: ${REVERB_APP_ID:?REVERB_APP_ID ist in Coolify zu setzen}
  REVERB_APP_KEY: ${REVERB_APP_KEY:?REVERB_APP_KEY ist in Coolify zu setzen}
  REVERB_APP_SECRET: ${REVERB_APP_SECRET:?REVERB_APP_SECRET ist in Coolify zu setzen}
  REVERB_SERVER_HOST: 0.0.0.0
  REVERB_SERVER_PORT: "8080"
  REVERB_HOST: ${REVERB_HOST:?REVERB_HOST ist in Coolify zu setzen}
  REVERB_PORT: "443"
  REVERB_SCHEME: https

  PDF_GHOSTSCRIPT_PATH: /usr/bin/gs
  PDF_WEASYPRINT_PATH: /usr/bin/weasyprint
  OCRMYPDF_PATH: /usr/bin/ocrmypdf
  PDF_PDFCPU_PATH: /usr/local/bin/pdfcpu
  PDF_PDFCPU_WATERMARK_FONT: Facit-Semibold
  PDF_TERMS_DOCUMENT_ID: ${PDF_TERMS_DOCUMENT_ID:-}

  SENTRY_LARAVEL_DSN: ${SENTRY_LARAVEL_DSN:-}
  SENTRY_ENVIRONMENT: production

  MAIL_MAILER: ${MAIL_MAILER:-log}
  MAIL_HOST: ${MAIL_HOST:-}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@twiceware-opsc.de}
  MAIL_FROM_NAME: "${APP_NAME:-opsc}"

services:
  migrate:
    build: *app-build
    image: opsc:latest
    environment: *app-env
    command: php artisan migrate --force --no-interaction
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  app:
    build: *app-build
    image: opsc:latest
    environment: *app-env
    expose:
      - "8080"
    volumes:
      - opsc-storage:/var/www/html/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  reverb:
    build: *app-build
    image: opsc:latest
    environment: *app-env
    expose:
      - "8080"
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: *app-build
    image: opsc:latest
    environment: *app-env
    volumes:
      - opsc-storage:/var/www/html/storage
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g
    restart: unless-stopped

  scheduler:
    build: *app-build
    image: opsc:latest
    environment: *app-env
    command: php artisan schedule:work
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD ist in Coolify zu setzen}
      MYSQL_DATABASE: ${DB_DATABASE:-opsc}
      MYSQL_USER: ${DB_USERNAME:-opsc}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD ist in Coolify zu setzen}
    volumes:
      - opsc-mysql:/var/lib/mysql
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - opsc-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  opsc-storage:
  opsc-mysql:
  opsc-redis:
